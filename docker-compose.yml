services:
  backend:
    build: ./backend
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
      - ./backend/database.db:/app/database.db
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8005
    depends_on:
      - backend